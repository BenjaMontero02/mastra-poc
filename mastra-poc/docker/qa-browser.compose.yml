services:
  qa-browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: mastra-qa-browser
    ports:
      - '9222:3000'
    environment:
      # Session timeout: 30 minutes (in milliseconds)
      SESSION_TIMEOUT: '1800000'
      # Max concurrent sessions (prevent resource exhaustion)
      MAX_CONCURRENT_SESSIONS: '5'
      # Keep browser alive for reuse across test runs
      KEEP_ALIVE: 'true'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/json/version']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
